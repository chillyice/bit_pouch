name: Release

# 发版流程（与咔哒同一套）：
#   1. 同步三处版本号：根 VERSION（V0.2）→ package.json / tauri.conf.json / Cargo.toml（0.2.0）
#   2. 打 tag v0.2.0（或手动触发）→ 三平台矩阵构建
#   3. 产物进 GitHub Release（默认 draft，确认无误后手动 Publish）
#   4. 服务器上的 mirror-bit-pouch 每日把最新**已发布** Release 同步到
#      /opt/ihomy/uploads/bit_pouch/，ihomy 发布页 /bit-pouch 从 /files/bit_pouch/ 直链下载
#
# 为什么默认发 draft：镜像取 GitHub 的 /releases/latest，它天然排除 draft / prerelease；
# 草稿不会被同步出去，发布页与镜像也不会拿到半成品。
#
# 应用内更新（与咔哒同一套）：
#   tauri-plugin-updater + Ed25519 签名。流水线用 Secrets 里的私钥给安装包签名，并生成
#   latest.json；客户端从 ihomy 镜像的 latest.json 检查更新（设置页可切 GitHub）。
#   一次性配置仓库 Secrets：
#     TAURI_SIGNING_PRIVATE_KEY          = ~/.tauri/bit_pouch.key 的文件内容
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 私钥密码（本项目生成时未设密码，留空字符串）
#   ⚠ tauri-cli 必须 >= 2.12.1：requireSignedVersion 要求签名里带版本号，旧 CLI 不带，
#   客户端会以 MissingSignedVersion 拒装每一次更新。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 串行：三个 job 都会往同一个 Release 上传资产，避免并发创建/更新同一个 draft。
      max-parallel: 1
      matrix:
        include:
          # Windows 只出 NSIS：安装器体验最稳，也方便覆盖安装。
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
          # Linux 出 deb + AppImage；不出 rpm（没人用，且需要另配签名密钥）。
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          # macOS 出 universal（arm64 + x86_64 一份 app）的 dmg。
          # 必须同时构建 app：只有 app bundle 会生成 macOS 更新包（.app.tar.gz），
          # 只出 dmg 时 tauri-action 不会写 latest.json 的 darwin-* 条目。
          # 没有 Apple 开发者证书 → 未签名、未公证，页面文案已写明首次打开方式。
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # universal 架构要把两个 macOS 目标都装上（否则打包时报 target not installed）。
      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux deps (Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install
        run: npm ci

      # tauri-action 会跑 beforeBuildCommand（npm run build）→ cargo build --release，
      # 再把各平台安装包上传到同一个 tag 的 Release。
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'bit_pouch v__VERSION__'
          releaseBody: '开发者的随身工具袋。各平台安装包见下方 Assets：Windows 是 `bit_pouch___VERSION___x64-setup.exe`（免安装版 `bit_pouch___VERSION___x64-portable.zip`，解压即用；`bit_pouch___VERSION___x64-portable.exe` 是免安装版的自动更新包，不用手动下）；Linux 是 `bit_pouch___VERSION___amd64.deb` 与 `.AppImage`；macOS 是 `bit_pouch___VERSION___universal.dmg`（未签名 / 未公证，首次打开请右键「打开」）；Web/PWA 是 `bit_pouch___VERSION___web.zip`（静态站点，解压后用任意静态服务器托管）。桌面端在「设置 → 软件更新」检查并安装更新；更新包经 Ed25519 签名校验，默认从 ihomy 镜像获取（macOS 的应用内更新需应用签名后才生效）。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Windows 免安装版：裸 exe 打个 zip（不含安装器、不写注册表）。
      # 前提是系统有 WebView2 Runtime（Win10 21H2 / Win11 自带）。
      - name: Portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          # 矩阵里带了 --target，cargo 产物在 target/<triple>/release，不在 target\release。
          # 本仓 Cargo 工程在 src-tauri/，Tauri 的默认 targetDir 也是 src-tauri/target。
          $exe = "src-tauri\target\x86_64-pc-windows-msvc\release\bit_pouch.exe"
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          $zip = "bit_pouch_${version}_x64-portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          gh release upload "v$version" $zip --clobber

      # 免安装版的自动更新包：同一个裸 exe 单独存一份并签名。清单里用
      # `windows-x86_64-portable` 条目指向它（客户端按安装形态选条目）。
      # 签名必须带版本号（requireSignedVersion），所以给 `--app-version`。
      - name: Portable update payload (bare exe + signature)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bundle="src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          mkdir -p "$bundle"
          portable="$bundle/bit_pouch_${version}_x64-portable.exe"
          cp "src-tauri/target/x86_64-pc-windows-msvc/release/bit_pouch.exe" "$portable"
          npm run tauri -- signer sign --app-version "$version" "$portable"
          test -f "$portable.sig"
          gh release upload "v$version" "$portable" "$portable.sig" --clobber

          # 往 tauri-action 生成的 latest.json 里加免安装版条目（用 node 改 JSON，
          # 避免 PowerShell 5.1 的 BOM / 中文转义问题）。
          tmp="$RUNNER_TEMP/portable-latest"
          mkdir -p "$tmp"
          gh release download "v$version" --pattern latest.json --dir "$tmp"
          node - "$tmp/latest.json" "$portable.sig" <<'EOF'
          const fs = require('node:fs');
          const [latestPath, sigPath] = process.argv.slice(2);
          const version = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const latest = JSON.parse(fs.readFileSync(latestPath, 'utf8'));
          latest.platforms = latest.platforms || {};
          latest.platforms['windows-x86_64-portable'] = {
            signature: fs.readFileSync(sigPath, 'utf8').trim(),
            url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/bit_pouch_${version}_x64-portable.exe`,
          };
          fs.writeFileSync(latestPath, `${JSON.stringify(latest, null, 2)}\n`);
          EOF
          gh release upload "v$version" "$tmp/latest.json" --clobber

      # Web/PWA 静态站点包：beforeBuildCommand 已经把 dist/ 构建好，这里只打包上传。
      - name: Web / PWA zip
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test -f dist/index.html
          # 打 dist 的内容而不是 dist/ 目录本身：解压后 index.html 就在根。
          (cd dist && zip -qr "../bit_pouch_${version}_web.zip" .)
          gh release upload "v$version" "bit_pouch_${version}_web.zip" --clobber

  # 最后一道闸：版本号三处一致 + Release 资产齐全。对不上就别 Publish 这个 draft。
  verify:
    name: verify release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # draft Release 只对具备 push 权限的 token 可见；contents: read 会让
      # `gh release view` 返回 release not found（首次发版踩过，已修）。
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check versions, assets and signatures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release view "v$version" --json assets > assets.json
          mkdir -p "$RUNNER_TEMP/release-check/sigs"
          gh release download "v$version" --pattern latest.json --dir "$RUNNER_TEMP/release-check"
          gh release download "v$version" --pattern '*.sig' --dir "$RUNNER_TEMP/release-check/sigs"
          node scripts/verify-release.mjs \
            --assets assets.json \
            --latest "$RUNNER_TEMP/release-check/latest.json" \
            --sigs "$RUNNER_TEMP/release-check/sigs"
